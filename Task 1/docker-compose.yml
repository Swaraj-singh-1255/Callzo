services:
  db:
    image: postgres:16-alpine
    container_name: callzo-db
    environment:
      POSTGRES_USER: callzo
      POSTGRES_PASSWORD: callzo
      POSTGRES_DB: callzo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callzo -d callzo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: callzo-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://callzo:callzo@db:5432/callzo
      DATABASE_URL_SYNC: postgresql://callzo:callzo@db:5432/callzo
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-callzo_test_secret_change_me}
      API_KEY: ${API_KEY:-dev_api_key_change_me}
      DEFAULT_MONTHLY_CAP_CENTS: "10000"
      LOG_LEVEL: INFO
      LATE_EVENT_THRESHOLD_DAYS: "30"
      RETRY_INTERVAL_SECONDS: "30"
      RECONCILE_INTERVAL_SECONDS: "300"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  
  simulator:
    image: meetrj/callzo-webhook-simulator
    container_name: simulator
    platform: linux/arm64
    depends_on:
      api:
        condition: service_healthy
    command: ["--url", "http://api:8000/webhooks/calls", "--scenario", "all"]

volumes:
  pgdata:
